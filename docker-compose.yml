version: "3.8"

services:
  web:
    build: .
    container_name: php-web
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mariadb:latest
    container_name: mariadb-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: erik
      MYSQL_USER: erik
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    #volumes:
    #- db-data:/var/lib/mysql

  node:
    image: node:16
    container_name: node-service
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: npm start
    ports:
      - "3000:3000"

volumes:
  db-data:
